name: M175a Studio — Hardware Validation & GitHub Actions CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses and Install SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Environment (Secrets)
        run: cp .env.example .env

      - name: Self-Healing Gradle Wrapper Setup
        run: |
          echo "===================================================="
          echo "         SELF-HEALING GRADLE WRAPPER SETUP"
          echo "===================================================="
          
          echo "Checking if gradle-wrapper.properties is missing or corrupted..."
          PROPERTIES_FILE="gradle/wrapper/gradle-wrapper.properties"
          PROPERTIES_OK=true
          if [ ! -f "$PROPERTIES_FILE" ]; then
            echo "⚠️ $PROPERTIES_FILE is missing!"
            PROPERTIES_OK=false
          else
            if ! grep -q "distributionUrl" "$PROPERTIES_FILE"; then
              echo "⚠️ $PROPERTIES_FILE is corrupted (missing distributionUrl)!"
              PROPERTIES_OK=false
            fi
          fi

          echo "Deleting corrupt/stale wrapper binaries..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradlew
          rm -f gradlew.bat
          
          if [ "$PROPERTIES_OK" = "false" ]; then
            echo "Restoring gradle-wrapper.properties to defaults..."
            mkdir -p gradle/wrapper
            cat << 'EOF' > "$PROPERTIES_FILE"
# Generated by Gradle
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi

          FALLBACK_REQUIRED=false
          if command -v gradle >/dev/null 2>&1; then
            echo "✅ Compatible system Gradle found! Using it to generate/restore wrapper..."
            gradle wrapper --gradle-version 9.3.1 || {
              echo "❌ System gradle command failed. Falling back to standalone installer..."
              FALLBACK_REQUIRED=true
            }
          else
            echo "⚠️ System Gradle not found. Standalone installation required."
            FALLBACK_REQUIRED=true
          fi

          if [ "$FALLBACK_REQUIRED" = "true" ]; then
            echo "Downloading official Gradle 9.3.1 binary distribution..."
            max_retries=3
            retry_count=0
            download_success=false
            while [ $retry_count -lt $max_retries ]; do
              echo "Attempt $((retry_count + 1)) to download Gradle 9.3.1..."
              if wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip && \
                 wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip.sha256; then
                download_success=true
                break
              fi
              retry_count=$((retry_count + 1))
              sleep 5
            done
            
            if [ "$download_success" = "false" ]; then
              echo "❌ Failed to download Gradle 9.3.1 or its SHA-256 sum after $max_retries attempts"
              exit 1
            fi

            echo "Validating SHA-256 checksum of downloaded Gradle distribution..."
            EXPECTED_SHA=$(cat gradle-9.3.1-bin.zip.sha256 | tr -d '[:space:]')
            ACTUAL_SHA=$(sha256sum gradle-9.3.1-bin.zip | awk '{print $1}')
            
            if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
              echo "❌ Checksum mismatch!"
              echo "Expected: $EXPECTED_SHA"
              echo "Actual:   $ACTUAL_SHA"
              exit 1
            fi
            echo "✅ Checksum validation succeeded!"

            echo "Extracting Gradle 9.3.1..."
            unzip -q gradle-9.3.1-bin.zip || {
              echo "❌ Failed to extract corrupt Gradle ZIP"
              exit 1
            }

            echo "Generating Gradle wrapper via standalone Gradle 9.3.1..."
            ./gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1 || {
              echo "❌ Standalone Gradle failed to generate wrapper"
              exit 1
            }

            echo "Cleaning up temporary standalone files..."
            rm -rf gradle-9.3.1-bin.zip gradle-9.3.1-bin.zip.sha256 gradle-9.3.1
          fi

          echo "Setting execution permissions on gradlew..."
          chmod +x gradlew || {
            echo "❌ Failed to set executable permissions on gradlew"
            exit 1
          }

          echo "Validating generated wrapper via version check..."
          ./gradlew --version || {
            echo "❌ Generated gradlew execution failed on version check."
            exit 1
          }

          echo "Validating generated wrapper via tasks check..."
          ./gradlew tasks --stacktrace --info || {
            echo "❌ Generated gradlew execution failed on tasks check."
            exit 1
          }
          
          echo "✅ Self-healing Gradle wrapper setup completed successfully!"
          echo "===================================================="

      - name: Print Detailed System & Build Diagnostics
        run: |
          echo "===================================================="
          echo "         SYSTEM & ENVIRONMENT DIAGNOSTICS"
          echo "===================================================="
          echo "Operating System & Linux Distribution:"
          uname -a
          cat /etc/os-release 2>/dev/null || true
          
          echo "----------------------------------------------------"
          echo "CPU Architecture:"
          lscpu | grep -E "Architecture|CPU\(s\)|Model name" || uname -m
          
          echo "----------------------------------------------------"
          echo "Available RAM (Memory):"
          free -h || cat /proc/meminfo | head -n 5
          
          echo "----------------------------------------------------"
          echo "Available Disk Space:"
          df -h .
          
          echo "----------------------------------------------------"
          echo "Java Version:"
          java -version || { echo "❌ Java not found"; exit 1; }
          
          echo "----------------------------------------------------"
          echo "Gradle Version (via gradlew):"
          ./gradlew --version || { echo "❌ Failed to run ./gradlew --version"; exit 1; }
          
          echo "----------------------------------------------------"
          echo "Android SDK and Variables:"
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "PATH: $PATH"
          if [ -d "$ANDROID_HOME" ]; then
            echo "Installed SDK Platforms:"
            ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          fi
          echo "===================================================="

      - name: Verify Project Structure and Configuration Files
        run: |
          echo "===================================================="
          echo "         PROJECT STRUCTURE VERIFICATION"
          echo "===================================================="
          echo "Checking files at workspace root:"
          ls -la
          
          echo "Verifying presence of critical Gradle configuration files..."
          files_to_check=("gradlew" "gradle/wrapper/gradle-wrapper.properties" "settings.gradle.kts" "build.gradle.kts" "app/build.gradle.kts")
          for file in "${files_to_check[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ [FOUND] $file"
            else
              echo "❌ [MISSING] $file"
              exit 1
            fi
          done
          
          echo "Gradle wrapper properties contents:"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "===================================================="

      - name: Run Gradle clean
        run: |
          # Robust retry-enabled Gradle runner function
          run_gradle_with_retry() {
            local max_attempts=3
            local attempt=1
            local exit_code=0
            while [ $attempt -le $max_attempts ]; do
              echo "Executing: ./gradlew $* (Attempt $attempt of $max_attempts)"
              ./gradlew "$@"
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              echo "⚠️ Gradle command failed on attempt $attempt"
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                echo "Sleeping 15 seconds before retrying..."
                sleep 15
              fi
            done
            return $exit_code
          }
          
          set -o pipefail
          run_gradle_with_retry clean --stacktrace --info --warning-mode all 2>&1 | tee gradle_clean.log || {
            echo "❌ 'gradlew clean' failed. Check diagnostic outputs above."
            exit 1;
          }

      - name: Run JVM unit tests
        run: |
          run_gradle_with_retry() {
            local max_attempts=3
            local attempt=1
            local exit_code=0
            while [ $attempt -le $max_attempts ]; do
              echo "Executing: ./gradlew $* (Attempt $attempt of $max_attempts)"
              ./gradlew "$@"
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              echo "⚠️ Gradle command failed on attempt $attempt"
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                echo "Sleeping 15 seconds before retrying..."
                sleep 15
              fi
            done
            return $exit_code
          }
          
          set -o pipefail
          run_gradle_with_retry test --stacktrace --info --warning-mode all 2>&1 | tee gradle_test.log || {
            echo "❌ 'gradlew test' run failed."
            exit 1;
          }

      - name: Run code linting
        run: |
          run_gradle_with_retry() {
            local max_attempts=3
            local attempt=1
            local exit_code=0
            while [ $attempt -le $max_attempts ]; do
              echo "Executing: ./gradlew $* (Attempt $attempt of $max_attempts)"
              ./gradlew "$@"
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              echo "⚠️ Gradle command failed on attempt $attempt"
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                echo "Sleeping 15 seconds before retrying..."
                sleep 15
              fi
            done
            return $exit_code
          }
          
          set -o pipefail
          run_gradle_with_retry lint --stacktrace --info --warning-mode all 2>&1 | tee gradle_lint.log || {
            echo "❌ 'gradlew lint' compilation/checks failed."
            exit 1;
          }

      - name: Assemble Debug APK
        run: |
          run_gradle_with_retry() {
            local max_attempts=3
            local attempt=1
            local exit_code=0
            while [ $attempt -le $max_attempts ]; do
              echo "Executing: ./gradlew $* (Attempt $attempt of $max_attempts)"
              ./gradlew "$@"
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                return 0
              fi
              echo "⚠️ Gradle command failed on attempt $attempt"
              attempt=$((attempt + 1))
              if [ $attempt -le $max_attempts ]; then
                echo "Sleeping 15 seconds before retrying..."
                sleep 15
              fi
            done
            return $exit_code
          }
          
          set -o pipefail
          run_gradle_with_retry assembleDebug --stacktrace --info --warning-mode all 2>&1 | tee gradle_assemble.log || {
            echo "❌ Debug APK assembly failed."
            exit 1;
          }

      - name: Diagnostic Post-Mortem on Failure
        if: failure()
        run: |
          echo "===================================================="
          echo "             POST-MORTEM BUILD FAILURE REPORT"
          echo "===================================================="
          
          echo "--- RETRIEVING FAILED GRADLE TASKS & MODULES ---"
          if [ -f gradle_clean.log ]; then
            echo "Failed tasks in clean:"
            grep -E "> Task .* FAILED" gradle_clean.log || true
          fi
          if [ -f gradle_test.log ]; then
            echo "Failed tasks in test:"
            grep -E "> Task .* FAILED" gradle_test.log || true
          fi
          if [ -f gradle_lint.log ]; then
            echo "Failed tasks in lint:"
            grep -E "> Task .* FAILED" gradle_lint.log || true
          fi
          if [ -f gradle_assemble.log ]; then
            echo "Failed tasks in assemble:"
            grep -E "> Task .* FAILED" gradle_assemble.log || true
          fi
          
          echo "--- COMPILER ERRORS (KOTLIN/JAVA) & FILENAMES ---"
          for log in gradle_clean.log gradle_test.log gradle_lint.log gradle_assemble.log; do
            if [ -f "$log" ]; then
              echo "Compiler Errors in $log:"
              grep -E "(e: file:\/\/|error: |\b[A-Za-z0-9_]+\.kt:|\b[A-Za-z0-9_]+\.java:)" "$log" | head -n 50 || true
            fi
          done
          
          echo "--- EXCEPTION CHAIN AND ROOT CAUSES ---"
          for log in gradle_clean.log gradle_test.log gradle_lint.log gradle_assemble.log; do
            if [ -f "$log" ]; then
              echo "Root causes in $log:"
              grep -A 25 "FAILURE: Build failed with an exception." "$log" || true
            fi
          done

          echo "--- FAILED UNIT TESTS (XML Reports) ---"
          find . -name "*.xml" -path "*/test-results/*" | while read -r report; do
            if grep -q "<failure" "$report"; then
              echo "❌ Failed Test Report: $report"
              echo "Failed Test Names and Assertion Messages:"
              grep -oP '(?<=<testcase name=")[^"]+' "$report" | while read -r test_name; do
                echo "  Test Name: $test_name"
              done
              echo "XML failure body details:"
              grep -A 8 -B 1 "<failure" "$report" || true
              echo "----------------------------------------------------"
            fi
          done

          echo "--- LAST 200 LINES OF GRADLE DAEMON LOGS ---"
          daemon_log=$(ls -t ~/.gradle/daemon/*/daemon-*.log 2>/dev/null | head -n 1)
          if [ -n "$daemon_log" ] && [ -f "$daemon_log" ]; then
            echo "Daemon log file: $daemon_log"
            tail -n 200 "$daemon_log"
          else
            echo "No Gradle daemon log found."
          fi
          
          echo "--- LAST 200 LINES OF LOGCAT ---"
          if command -v adb >/dev/null 2>&1; then
            adb logcat -d -t 200 2>/dev/null || echo "Logcat not available (no emulator running)"
          else
            echo "adb not installed / Logcat not available"
          fi
          echo "===================================================="

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M175aStudio-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*
            app/build/reports/lint/
          if-no-files-found: ignore

      - name: Upload Build Reports & Crash Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-and-crash-logs
          path: |
            app/build/reports/
            **/hs_err_pid*.log
            **/replay_pid*.log
          if-no-files-found: ignore

      - name: Upload Proguard/R8 Mapping Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: app/build/outputs/mapping/
          if-no-files-found: ignore

      - name: Upload Gradle Daemon Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-daemon-logs
          path: ~/.gradle/daemon/*/daemon-*.log
          if-no-files-found: ignore

