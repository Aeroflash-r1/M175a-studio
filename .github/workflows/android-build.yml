name: M175a Studio — Hardware Validation & GitHub Actions CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses and Install SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Environment (Secrets)
        run: cp .env.example .env

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Print Build Information
        run: |
          echo "===================================================="
          echo "              M175a CI BUILD INFORMATION"
          echo "===================================================="
          echo "Java Version:"
          java -version
          echo "----------------------------------------------------"
          echo "Gradle Version:"
          ./gradlew --version | grep "Gradle"
          echo "----------------------------------------------------"
          echo "Android Gradle Plugin Version: 9.1.1"
          echo "Kotlin Version: 2.2.10"
          echo "Compile SDK Version: 36 (minorApiLevel = 1)"
          echo "Target SDK Version: 36"
          echo "Build Variant: debug"
          echo "===================================================="

      - name: Run clean
        run: ./gradlew clean

      - name: Run unit tests
        run: ./gradlew test

      - name: Run lint
        run: ./gradlew lint

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M175aStudio-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Upload Proguard/R8 Mapping Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-files
          path: app/build/outputs/mapping/
          if-no-files-found: ignore
